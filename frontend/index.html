<!doctype html>
<html lang="en" data-theme="dark" data-motion="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinfolk</title>
    <meta name="kinfolk-commit" content="__KINFOLK_COMMIT__" />
    <meta
      name="description"
      content="Relatives each keep their own tree, then link them, so the combined graph shows how several families actually join up."
    />
    <!--
      Link previews. Absolute URLs because crawlers resolve nothing relative, and the
      image is frontend/public/og-image.png, regenerated by `pnpm screenshots`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kinfolk" />
    <meta property="og:title" content="Kinfolk -- a family tree is not a tree" />
    <meta
      property="og:description"
      content="Relatives each keep their own tree, then link them, so the combined graph shows how several families actually join up."
    />
    <meta property="og:url" content="https://sagargupta.online/kinfolk/" />
    <meta property="og:image" content="https://sagargupta.online/kinfolk/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kinfolk: a family graph with generations, partners and kinship labels" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; connect-src __KINFOLK_CONNECT_SOURCES__; font-src 'self'; form-action 'self'; frame-src 'none'; img-src 'self' data: https://avatars.githubusercontent.com; media-src 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:"
    />

    <!--
      Theme before first paint.

      Kept as a blocking external script so it still runs before paint while the CSP
      can reject inline JavaScript. Its behaviour mirrors THEME_SCRIPT in lib/theme.ts,
      including this one theme-color meta, which it rewrites from the stored choice.
      The content here is the dark default, matching data-theme above.
    -->
    <meta name="theme-color" content="#0b1012" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
