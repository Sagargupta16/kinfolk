name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 22, matching the `engines.node` floor in package.json.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck both frontends
        run: |
          pnpm typecheck
          pnpm --dir frontend typecheck

      - name: Build
        run: pnpm build
        env:
          # Deliberately NOT the real secrets.
          #
          # `lib/db/client.ts` is built to be importable with no DATABASE_URL, because
          # Next collects page data by importing every route's module graph -- so a
          # throw at module scope would fail the build on a fresh clone. Nothing in
          # this app queries at build time (every data route is `ƒ`, server-rendered on
          # demand), so the build needs no database and CI should not hold one.
          #
          # AUTH_SECRET is set to a throwaway because Auth.js logs `MissingSecret` at
          # import; the value is never used to sign anything here.
          AUTH_SECRET: build-only-not-a-real-secret

      - name: Build Pages app
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://kinfolk-neon.vercel.app' }}
        run: pnpm build

      - name: Dead Tailwind utility guard
        # A Tailwind 4 arbitrary value needs PARENTHESES to read a CSS variable.
        # The square-bracket form emits the literal property name, which is not a
        # valid value -- so the property silently falls back to its initial one and
        # nothing warns: not the build, not Biome, not the browser. Scanned in the
        # BUILT css, not the source, because Tailwind also reads markdown and
        # comments as class-name sources.
        run: |
          if grep -rlF --include='*.css' -- '-\[--' .next/static/ frontend/dist/; then
            echo '::error::Dead Tailwind utility in the built CSS: a CSS variable in an arbitrary value needs PARENTHESES, not square brackets. See the gotcha in CLAUDE.md.'
            exit 1
          fi
