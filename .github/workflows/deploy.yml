name: Deploy

# Vercel, not GitHub Pages, and the reason is structural rather than a preference.
#
# `pnpm build` emits four DYNAMIC routes (`ƒ`): /tree, /demo, /signin and the Auth.js
# handler. They are server-rendered on demand because the app reads Neon per request,
# runs server actions for every write, and keeps Auth.js DATABASE sessions -- none of
# which a static host can serve. `prod/kalchar` reached the same conclusion and left
# its own Pages workflow dormant with a note saying so.
#
# Vercel's Git integration and this migration workflow start independently on the
# same push. Runtime changes must therefore tolerate the previous schema until this
# workflow finishes; it applies the committed migrations and then proves the promoted
# deployment answers.

on:
  push:
    branches: [main]
    # Only when something that can change the deployed behaviour moves. A README
    # edit should not open a database connection.
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "drizzle/**"
      - "auth.ts"
      - "next.config.mjs"
      - "drizzle.config.ts"
      - "scripts/check-migrations.mts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never two deploys at once, and never cancel one midway: a half-applied migration
# is worse than a late one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    name: apply schema to Neon
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Gated on a GitHub Environment so the production DATABASE_URL is only readable
    # from this job, and so a reviewer can be required before it runs.
    environment:
      # No `url:` here on purpose: it would be a guess, and the one this workflow
      # first shipped with pointed at an unrelated site. Vercel's own deployment
      # link is the authoritative one.
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        # `db:migrate`, never `db:push`. Push diffs the live schema and applies
        # whatever it decides, which is right for a scratch branch and wrong for
        # production -- it can drop a column it thinks is redundant. `migrate` runs
        # the committed SQL files in order and nothing else.
        #
        # Also skipped when DATABASE_URL is absent, and that guard is the point.
        # The migrations exist now, so the old "is there a drizzle/ directory"
        # check alone would start running `db:migrate` with an empty connection
        # string on any repo that has not had the secret added -- turning a green
        # deploy red for a schema that is already correct. A migration that cannot
        # reach a database has nothing to say, so it is skipped loudly instead.
        #
        # The FIRST migration (0000) is a baseline of a schema created with
        # `db:push`, so it must be recorded as applied rather than executed against
        # the live database, whose tables it would try to CREATE. Do that once, by
        # hand, before enabling this step: see docs/DEPLOYMENT.md.
        run: |
          if [ ! -d drizzle ] || ! ls drizzle/*.sql >/dev/null 2>&1; then
            echo "No committed migrations -- skipping. Generate them with \`pnpm db:generate\`."
          elif [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL is not set, so migrations were SKIPPED. Add the secret to the production environment to enable them."
          else
            pnpm db:check-migrations
            pnpm db:migrate
            pnpm db:check-migrations --complete
          fi
        env:
          # The DIRECT Neon host, not the -pooler one: drizzle-kit opens a plain TCP
          # connection that the pooler endpoint will not serve.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  verify:
    name: verify the deployment answers
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only once somebody has said where production IS.
    #
    # The first run of this workflow probed a guessed `kinfolk.vercel.app` and got three
    # green checks from a completely unrelated site squatting that hostname -- no
    # `_next/static` anywhere in its markup, so not even a Next build. A default that
    # silently tests a stranger's server is worse than no check: it reports success for
    # a deployment that does not exist.
    #
    # So the URL is required now rather than guessed. Set the repository variable
    # PRODUCTION_URL (Settings -> Secrets and variables -> Actions -> Variables) and
    # this starts running; until then it skips and says so.
    if: vars.PRODUCTION_URL != ''
    steps:
      - name: Wait for Vercel to promote the new build
        # Vercel builds on its own trigger, so this workflow cannot know when the
        # new deployment is live. A fixed wait is honest about that: the check
        # below is what actually decides, and it retries.
        run: sleep 45

      - name: Check the public endpoints
        env:
          BASE: ${{ vars.PRODUCTION_URL }}
        run: |
          set -u
          fail=0

          probe() {
            local path="$1" expected="$2" label="$3"
            local code=""
            # Retried, because a cold serverless function can exceed the first
            # timeout and a single 000 would be a false alarm.
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "${BASE}${path}" || echo "000")
              [ "$code" = "$expected" ] && break
              sleep 10
            done
            if [ "$code" = "$expected" ]; then
              echo "  ok    ${label}: ${code}"
            else
              echo "::error::${label} returned ${code}, expected ${expected} (${BASE}${path})"
              fail=1
            fi
          }

          # The landing page renders with no session and no database read.
          probe "/" 200 "landing page"
          # Sign-in must be reachable, or nobody can get in at all.
          probe "/signin" 200 "sign in"
          # Auth.js is configured and answering. This one is the real canary: it
          # returns 200 only when AUTH_SECRET and the GitHub provider are both
          # present, so it catches a missing secret that the pages would not.
          probe "/api/auth/providers" 200 "auth providers"
          # /tree with no session redirects to /signin rather than erroring.
          probe "/tree" 307 "tree redirects when signed out"

          exit "$fail"
