name: Deploy

# Vercel, not GitHub Pages, and the reason is structural rather than a preference.
#
# `pnpm build` emits every route except / and the icons (`icon.svg`,
# `opengraph-image.png`) as DYNAMIC (`ƒ`): /tree, /demo, /signin, /contacts, the Auth.js
# handler and the JSON API. They are server-rendered on demand because the app reads
# Neon per request, runs server actions for every write, and keeps Auth.js DATABASE
# sessions -- none of which a static host can serve. `prod/kalchar` reached the same
# conclusion and left its own Pages workflow dormant with a note saying so.
#
# Vercel's Git integration and this migration workflow start independently on the
# same push. Runtime changes must therefore tolerate the previous schema until this
# workflow finishes; it applies the committed migrations and then proves the promoted
# deployment answers.

on:
  push:
    branches: [main]
    # Only when something that can change the deployed behaviour moves. A README
    # edit should not open a database connection.
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "drizzle/**"
      - "auth.ts"
      - "next.config.mjs"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "vercel.json"
      - "drizzle.config.ts"
      - "scripts/check-migrations.mts"
      - "scripts/check-production.mts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never two deploys at once, and never cancel one midway: a half-applied migration
# is worse than a late one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    name: apply schema to Neon
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Gated on a GitHub Environment so the production DATABASE_URL is only readable
    # from this job, and so a reviewer can be required before it runs.
    environment:
      # No `url:` here on purpose: it would be a guess, and the one this workflow
      # first shipped with pointed at an unrelated site. Vercel's own deployment
      # link is the authoritative one.
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes or fetches, so the token need not stay in .git/config.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        # `db:migrate`, never `db:push`. Push diffs the live schema and applies
        # whatever it decides, which is right for a scratch branch and wrong for
        # production -- it can drop a column it thinks is redundant. `migrate` runs
        # the committed SQL files in order and nothing else.
        #
        # The FIRST migration (0000) is a baseline of a schema created with
        # `db:push`, so it must be recorded as applied rather than executed against
        # the live database, whose tables it would try to CREATE. Do that once, by
        # hand, before enabling this step: see docs/DEPLOYMENT.md.
        run: |
          if [ ! -d drizzle ] || ! ls drizzle/*.sql >/dev/null 2>&1; then
            echo "::error::drizzle/ has no committed migrations. Production already has a migration history, so this checkout is broken; restore drizzle/ rather than deploying past it."
            exit 1
          elif [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is required in the production environment. Migration verification did not run."
            exit 1
          else
            pnpm db:check-migrations
            pnpm db:migrate
            pnpm db:check-migrations --complete
          fi
        env:
          # The DIRECT Neon host, not the -pooler one: drizzle-kit opens a plain TCP
          # connection that the pooler endpoint will not serve.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  verify:
    name: verify the serving commit and database
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only once somebody has said where production IS.
    #
    # The first run of this workflow probed a guessed `kinfolk.vercel.app` and got three
    # green checks from a completely unrelated site squatting that hostname -- no
    # `_next/static` anywhere in its markup, so not even a Next build. A default that
    # silently tests a stranger's server is worse than no check: it reports success for
    # a deployment that does not exist.
    #
    # The readiness script fails if PRODUCTION_URL is missing. A skipped probe
    # must never make a production release look verified.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Wait for this commit and verify readiness
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node --experimental-strip-types scripts/check-production.mts --api --wait
