name: Production health

# A deploy that passed its checks can still stop answering later: Neon suspends an
# idle branch, a secret gets rotated, a domain expires. This is the daily question
# "is it still up", separate from "did this change ship".

on:
  schedule:
    # 02:31 UTC. An odd minute on purpose -- the top of the hour is when every
    # scheduled workflow on GitHub queues at once, and a delayed run reports as a
    # failure it did not have.
    - cron: "31 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: API, database and Pages assets
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Required, not guessed. A fallback hostname here would probe whatever happens to
    # answer at it -- the deploy workflow's guessed default returned three green checks
    # from an unrelated site squatting `kinfolk.vercel.app`, which is a health check
    # reporting on somebody else's server. Set the PRODUCTION_URL repository variable.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Probe both production surfaces
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          SPA_URL: ${{ vars.PAGES_URL || 'https://sagargupta.online/kinfolk/' }}
        run: node --experimental-strip-types scripts/check-production.mts
