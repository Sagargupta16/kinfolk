name: Deploy the UI to Pages

# The static UI, built from `frontend/` and published to
# sagargupta.online/kinfolk/ -- the same arrangement as ledger-sync, where Pages
# serves the interface and a separate deployment serves the API.
#
# This replaces publishing `docs/`, which was a hand-written landing page. That page
# was a copy of words the app already had, in a file with its own colour values, and
# it drifted -- which is what a duplicate always does. The app's own landing screen
# is now the page, so there is nothing to keep in sync.
#
# The repository can stay private because Pages publishes only the BUILD OUTPUT.
# Source is never uploaded, which is also why `sourcemap: false` matters in
# vite.config.ts.

on:
  push:
    branches: [main]
    # Everything the bundle is built from. `components/`, `lib/` and `app/globals.css`
    # are included because the SPA aliases them -- a change to the canvas or to a
    # design token has to reach Pages, and listing only `frontend/` would silently
    # serve a stale UI after a component change.
    paths:
      - "frontend/**"
      - "components/**"
      - "lib/**"
      - "app/globals.css"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pages allows one deployment at a time, and a queued one should wait rather than be
# dropped: the last push is the content that should end up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the SPA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # BOTH, and the `pages` scope is the one that is easy to miss. This job runs
      # `configure-pages`, which READS the Pages site configuration through the API,
      # so `contents: read` alone fails with "Resource not accessible by integration"
      # -- a message about the integration rather than about a missing scope, which
      # sends you looking at repository visibility instead.
      #
      # It is the same trap as the deploy job below: a job-level `permissions` block
      # REPLACES the workflow default rather than adding to it, so every scope a job
      # needs has to be listed even when the workflow already granted one.
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # From the repo root, not `frontend/`: it is a workspace package, so its
      # dependencies resolve through the root lockfile.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard the API base URL
        # The SPA is useless without it -- every fetch would go to the Pages origin,
        # which has no API, and the canvas would show "could not reach the server".
        # Failing here names the cause; shipping would leave it to a visitor to find.
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "::error::VITE_API_BASE_URL is not set. Add it as a repository variable."
            exit 1
          fi
          case "${{ vars.VITE_API_BASE_URL }}" in
            https://*) echo "api: ${{ vars.VITE_API_BASE_URL }}" ;;
            *) echo "::error::VITE_API_BASE_URL must be an https origin."; exit 1 ;;
          esac

      - name: Build
        working-directory: frontend
        env:
          # Switches Vite's `base` to /kinfolk/, which is the subpath Pages serves.
          GITHUB_PAGES: "true"
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: pnpm build

      - name: Copy index.html to 404.html for SPA routing
        # Pages has no rewrite rules, so a deep link like /kinfolk/tree would 404. The
        # 404 page IS the app, which then reads the path and renders the right screen.
        # Same technique ledger-sync uses.
        run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload the build
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend/dist

  deploy:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # All THREE, because a job-level `permissions` block REPLACES the workflow
      # default rather than adding to it. Listing only the two Pages scopes dropped
      # `contents: read`, and on a private repository checkout then failed with
      # "fatal: repository not found" -- which reads like a wrong URL and is actually
      # the token having no permission to see the repo at all.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
