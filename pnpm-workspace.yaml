packages:
  - "."
  # The static UI, published to GitHub Pages. Its own package because it has its own
  # toolchain: Vite and React where the root has Next, and no database or server
  # dependencies at all. Same arrangement as `apps/ledger-sync/frontend`.
  - "frontend"

# pnpm 11 reads build-script approval from here, not from package.json.
allowBuilds:
  esbuild: true
  sharp: true

# pnpm holds brand-new releases back by default as a supply-chain measure. These
# are patch bumps we deliberately took early; each entry is pinned to an exact
# version so the exception cannot silently widen.
minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.6'
  - '@biomejs/cli-darwin-arm64@2.5.6'
  - '@biomejs/cli-darwin-x64@2.5.6'
  - '@biomejs/cli-linux-arm64-musl@2.5.6'
  - '@biomejs/cli-linux-arm64@2.5.6'
  - '@biomejs/cli-linux-x64-musl@2.5.6'
  - '@biomejs/cli-linux-x64@2.5.6'
  - '@biomejs/cli-win32-arm64@2.5.6'
  - '@biomejs/cli-win32-x64@2.5.6'
  - postcss@8.5.24

# Transitive deps drag in old builds; hold everything at the current line.
#
# All three are NESTED under `next`, not direct dependencies -- `pnpm ls` showed
# `next > postcss@8.4.31` and `next > sharp@0.34.5` while the top level already had
# postcss 8.5.24. So the advisories are real but unreachable from our own code, and
# the fix is to stop the old copies existing rather than to bump anything we import.
#
# postcss: four advisories, the highest HIGH, all fixed by >=8.5.23. Only ever runs
# at build time here (Tailwind), so it never sees attacker input in production --
# but a build-time parser reading arbitrary `.map` files is still worth closing.
#
# sharp: HIGH, fixed in >=0.35.0. Next uses it for image optimisation, which this
# app does not do (avatars are initials, and `photoKey` has no route yet), so it is
# shipped-but-unused. Held forward anyway: "we do not call it today" is a fact about
# this week's code, not a property of the dependency.
overrides:
  esbuild: ">=0.28.1"
  postcss: ">=8.5.25"
  sharp: ">=0.35.3"
